<!DOCTYPE html>
<html>
<head>

    <title>arthControl</title>

    <style>

        body {
            background-color: #252525;
            color: white;
            font-family: Georgia;
            margin: 20px;
        }

        .container {
            border: 3px solid lightgreen;
            padding: 20px;
            min-height: 500px;
        }

        .heading {
            background-color: black;
            color: lightgreen;
            text-align: center;
            padding: 15px;
            font-size: 28px;
        }

        .heading p {
            font-size: 16px;
            color: white;
        }

        .expenses {
            margin-top: 25px;
            padding: 20px;
            border: 2px solid lightgreen;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid lightgreen;
            background-color: #eeeeee;
        }

        button {
            padding: 10px 20px;
            background-color: lightgreen;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: green;
            color: white;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid white;
            padding: 12px;
            text-align: center;
        }

        th {
            color: lightgreen;
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
            color: lightgreen;
        }

        h2, h3 {
            color: lightgreen;
        }

        .delete {
            background-color: #ff5555;
            color: white;
        }

    </style>
<!-- PWA SETTINGS -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#252525">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="arthControl">

</head>

<body>

<div class="container">

    <!-- MAIN HEADING -->

    <div class="heading">

        <b>arthControl</b>

        <p>My Personal Expense Tracker</p>

        <!-- NAME INPUT -->

        <input type="text"
        id="userName"
        placeholder="Enter your name">

        <button onclick="welcomeUser()">Enter</button>

        <h3 id="welcomeMessage">Welcome!</h3>

    </div>


    <!-- EXPENSE SECTION -->

    <h2>My Expenses</h2>

    <div class="expenses">

        <h3>Daily Spends</h3>

        <label>Select Date:</label>

        <br>

        <input type="date" id="expenseDate">

        <br><br>

        <input type="text"
        id="expenseName"
        placeholder="Expense name (Food)">

        <input type="number"
        id="expenseAmount"
        placeholder="Amount (50)"
        min="0.01"
        step="0.01">

        <br>

        <button onclick="addExpense()">ADD +</button>


        <!-- EXPENSE TABLE -->

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Expense</th>
                    <th>Amount (₹)</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="expenseTable">

            </tbody>

        </table>


        <!-- TOTAL -->

        <div class="total">

            Total: ₹<span id="total">0.00</span>

        </div>

    </div>

</div>


<script>

    let total = 0;


    // WELCOME USER

    function welcomeUser() {

        let name =
        document.getElementById("userName").value;

        if (name.trim() === "") {

            alert("Please enter your name!");

            return;

        }

        document.getElementById("welcomeMessage").innerText =
        "Welcome, " + name.trim() + "! 💚";

    }


    // AUTOMATIC TODAY'S DATE

    let today = new Date();

    let dateString =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    document.getElementById("expenseDate").value =
        dateString;


    // ADD EXPENSE

    function addExpense() {

        let date =
        document.getElementById("expenseDate").value;

        let name =
        document.getElementById("expenseName").value.trim();

        let amount =
        Number(document.getElementById("expenseAmount").value);


        // VALIDATION

        if (date === "" || name === "" ||
            !Number.isFinite(amount) || amount <= 0) {

            alert("Please enter all details!");

            return;

        }


        // CREATE TABLE ROW

        let table =
        document.getElementById("expenseTable");

        let row = table.insertRow();


        let cell1 = row.insertCell(0);
        let cell2 = row.insertCell(1);
        let cell3 = row.insertCell(2);
        let cell4 = row.insertCell(3);


        cell1.innerText = date;
        cell2.innerText = name;
        cell3.innerText = "₹" + amount.toFixed(2);


        // DELETE BUTTON

        let deleteButton =
        document.createElement("button");

        deleteButton.innerText = "Delete";

        deleteButton.className = "delete";


        deleteButton.onclick = function() {

            total = total - amount;

            row.remove();

            updateTotal();

        };


        cell4.appendChild(deleteButton);


        // UPDATE TOTAL

        total = total + amount;

        updateTotal();


        // CLEAR INPUT BOXES

        document.getElementById("expenseName").value = "";

        document.getElementById("expenseAmount").value = "";

    }


    // UPDATE TOTAL AMOUNT

    function updateTotal() {

        document.getElementById("total").innerText =
        total.toFixed(2);

    }

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {

        navigator.serviceWorker.register("./sw.js")
            .then(function() {
                console.log("arthControl is ready!");
            })
            .catch(function(error) {
                console.log("Error:", error);
            });

    });
}
</script>

</body>
</html>
